[package]
name = "tinned_ffi"
version = "0.1.0"
edition = "2024"
include = ["include/**", "src/**", "Cargo.toml"]

[lib]
name = "tinned_ffi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
tinned_lib = { path = "../tinned_lib" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
