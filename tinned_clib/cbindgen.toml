language = "C"
pragma_once = true
cpp_compat = true
usize_is_size_t = true
autogen_warning = "/* @generated by cbindgen -- do not edit. */"

# Keep includes minimal (cbindgen will add std headers unless you turn that off)
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
no_includes = false

# Formatting (all optional; safe defaults shown)
line_length = 100
tab_width = 4
braces = "SameLine"

# Only parse your target deps (faster, safer)
only_target_dependencies = true
[parse]
parse_deps = false

# Optional: pointer nullability annotations (supported in 0.29.0)
# [ptr]
# non_null_attribute = "_Nonnull"
# nullable_attribute  = "_Nullable"
