[package]
name = "tinned"
version = "0.1.0"
edition = "2021"

[dependencies]
dashmap = "5.4"
lazy_static = "1.4"
float-cmp = "0.9"
num-complex = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
typetag = "0.2"

[dev-dependencies]
num-integer = "0.1"
rand = "0.9"

[lib]
name = "tinned"
path = "src/lib.rs"
